name: Binary Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-webui:
    name: Build WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build WebUI
        working-directory: ./BilibiliCookieMgmt-web
        run: |
          npm ci
          npm run build

      - name: Upload WebUI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: ./BilibiliCookieMgmt-web/dist

  build-backend:
    name: Build Backend
    needs: build-webui
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            sep: ';'
          - os: ubuntu-latest
            platform: linux
            arch: x64
            sep: ':'
          # - os: macos-12
          #   platform: osx
          #   arch: x64
          #   sep: ':'
          - os: macos-latest
            platform: osx
            arch: arm64
            sep: ':'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download WebUI Artifact
        uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: ./BilibiliCookieMgmt/static

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pyyaml httpx aiofiles aiosqlite cryptography pyinstaller

      - name: Build with PyInstaller
        working-directory: ./BilibiliCookieMgmt
        run: |
          pyinstaller --onefile --name "BilibiliCookieMgmt-CLI-${{ matrix.platform }}-${{ matrix.arch }}" --add-data "static${{ matrix.sep }}static" main.py

      - name: Smoke test Windows persistent data path
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ./BilibiliCookieMgmt/dist
        run: |
          $exe = Get-ChildItem -Filter "BilibiliCookieMgmt-CLI-*.exe" | Select-Object -First 1
          $process = Start-Process -FilePath $exe.FullName -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:18000/api/v1/health" | Out-Null
                $ready = $true
                break
              } catch {}
            }
            if (-not $ready) { throw "打包程序未能启动" }
            foreach ($path in @("data/config.json", "data/data.db", "data/data.key")) {
              if (-not (Test-Path -LiteralPath $path)) { throw "缺少持久文件: $path" }
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cd BilibiliCookieMgmt/dist
          zip -r ../../BilibiliCookieMgmt-CLI-${{ matrix.platform }}-${{ matrix.arch }}.zip BilibiliCookieMgmt-CLI-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          cd BilibiliCookieMgmt/dist
          Compress-Archive -Path "BilibiliCookieMgmt-CLI-${{ matrix.platform }}-${{ matrix.arch }}.exe" -DestinationPath "../../BilibiliCookieMgmt-CLI-${{ matrix.platform }}-${{ matrix.arch }}.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: BilibiliCookieMgmt-CLI-${{ matrix.platform }}-${{ matrix.arch }}
          path: BilibiliCookieMgmt-CLI-${{ matrix.platform }}-${{ matrix.arch }}.zip

  release:
    name: Release
    needs: build-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display Artifacts
        run: ls -R artifacts

      - name: Create Release (Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*.zip
          prerelease: false
          generate_release_notes: true

      - name: Create Release (Nightly)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automatic nightly build from main branch.
            Commit: ${{ github.sha }}
            Time: ${{ github.event.head_commit.timestamp }}
          files: artifacts/**/*.zip
          prerelease: true
          make_latest: false
